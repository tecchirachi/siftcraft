<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ShiftCraft アイコン（Issue #39）: カレンダー＋時計で「シフト管理」を一目で伝える。
       PNG版と同じデザイン。生成元は scripts/make-icons.py -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb287"/>
      <stop offset="0.5" stop-color="#ff9e6e"/>
      <stop offset="1" stop-color="#ff8c5a"/>
    </linearGradient>
    <clipPath id="page">
      <rect x="72" y="87" width="368" height="348" rx="28"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- カレンダーページ -->
  <g clip-path="url(#page)">
    <rect x="72" y="87" width="368" height="348" fill="#fffbf4"/>
    <rect x="72" y="87" width="368" height="87" fill="#f0874f"/>
  </g>
  <!-- 綴じリング -->
  <rect x="154" y="68" width="28" height="45" rx="13" fill="#fffbf4" stroke="#d67842" stroke-width="4"/>
  <rect x="335" y="68" width="28" height="45" rx="13" fill="#fffbf4" stroke="#d67842" stroke-width="4"/>
  <!-- ヘッダーの S -->
  <text x="256" y="132" font-family="Arial, sans-serif" font-size="59" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">S</text>
  <!-- 日付ドット（色付きはシフトのある日） -->
  <circle cx="110" cy="212" r="13" fill="#e07f45"/>
  <circle cx="184" cy="212" r="13" fill="#e8ddd2"/>
  <circle cx="258" cy="212" r="13" fill="#e8ddd2"/>
  <circle cx="332" cy="212" r="13" fill="#e8ddd2"/>
  <circle cx="110" cy="281" r="13" fill="#3f8fd2"/>
  <circle cx="184" cy="281" r="13" fill="#e8ddd2"/>
  <circle cx="258" cy="281" r="13" fill="#e8ddd2"/>
  <circle cx="332" cy="281" r="13" fill="#e8ddd2"/>
  <circle cx="110" cy="350" r="13" fill="#e8ddd2"/>
  <circle cx="184" cy="350" r="13" fill="#3f9c72"/>
  <circle cx="258" cy="350" r="13" fill="#e8ddd2"/>
  <circle cx="332" cy="350" r="13" fill="#e8ddd2"/>
  <!-- 時計バッジ -->
  <circle cx="387" cy="387" r="79" fill="#ff8a5f" stroke="#fffbf4" stroke-width="8"/>
  <line x1="387" y1="387" x2="338" y2="387" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <line x1="387" y1="387" x2="387" y2="351" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="387" cy="387" r="9" fill="#ffffff"/>
</svg>
